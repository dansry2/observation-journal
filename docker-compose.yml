services:
  observation-journal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: observation-journal
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-local-password
      SECRET_KEY: local-dev-secret-key-not-for-production
      DATABASE_URL: sqlite:////app/data/journal.db
      USERS_DATABASE_URL: sqlite:////app/data/users.db
      SUBPATH: ""
    volumes:
      - ./data:/app/data
    restart: unless-stopped
